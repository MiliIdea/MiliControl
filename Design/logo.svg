<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B4250"/>
      <stop offset="0.55" stop-color="#20242E"/>
      <stop offset="1" stop-color="#101218"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#0A6BFF"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bodyshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- icon body (squircle) -->
  <g filter="url(#bodyshadow)">
    <rect x="76" y="76" width="872" height="872" rx="202" fill="url(#bg)"/>
  </g>
  <!-- top sheen -->
  <rect x="76" y="76" width="872" height="436" rx="202" fill="url(#sheen)"/>

  <!-- ROW 1 -->
  <rect x="190" y="300" width="190" height="150" rx="24" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="2"/>
  <!-- highlighted (current) tile -->
  <g filter="url(#glow)">
    <rect x="416" y="300" width="190" height="150" rx="24" fill="url(#accent)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4"/>
  </g>
  <rect x="642" y="300" width="190" height="150" rx="24" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="2"/>

  <!-- ROW 2 -->
  <rect x="190" y="474" width="190" height="150" rx="24" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="2"/>
  <rect x="416" y="474" width="190" height="150" rx="24" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="2"/>
  <rect x="642" y="474" width="190" height="150" rx="24" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="2"/>

  <!-- ADD ROW (the signature feature): dashed ghost row with a plus -->
  <rect x="190" y="648" width="642" height="96" rx="24" fill="#4DA3FF" fill-opacity="0.10"
        stroke="#4DA3FF" stroke-opacity="0.85" stroke-width="4" stroke-dasharray="14 12"/>
  <g stroke="#5BA9FF" stroke-width="12" stroke-linecap="round">
    <line x1="511" y1="668" x2="511" y2="724"/>
    <line x1="483" y1="696" x2="539" y2="696"/>
  </g>
</svg>
