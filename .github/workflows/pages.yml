name: Website redirect

# The website lives on Vercel at https://control.mili.today/. GitHub Pages keeps the old
# https://miliidea.github.io/MiliControl/ address working by redirecting every page there.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write redirect pages
        run: |
          mkdir site
          for page in index 404; do
            cat > "site/$page.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Moved to control.mili.today</title>
          <link rel="canonical" href="https://control.mili.today/">
          <meta http-equiv="refresh" content="0; url=https://control.mili.today/">
          <script>location.replace('https://control.mili.today/' + location.hash)</script>
          <p>This site has moved to <a href="https://control.mili.today/">control.mili.today</a>.</p>
          HTML
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
